name: Apply v0.7.2
on:
  push:
    paths:
      - '.github/workflows/apply-v072.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate v0.7.2
        shell: bash
        run: |
          set -euo pipefail
          cat .seed/v072.apply.p1 .seed/v072.apply.p2 .seed/v072.apply.p3 .seed/v072.apply.p4 .seed/v072.apply.p5 > /tmp/apply_v072.py
          python /tmp/apply_v072.py
          python -m py_compile custom_components/zwave_route_optimizer/*.py
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('custom_components/zwave_route_optimizer')
          assert json.loads((root / 'manifest.json').read_text())['version'] == '0.7.2'
          json.loads((root / 'strings.json').read_text())
          json.loads((root / 'translations/en.json').read_text())
          init = (root / '__init__.py').read_text()
          optimizer = (root / 'optimizer.py').read_text()
          services = (root / 'services.yaml').read_text()
          assert 'ATTR_ADAPTIVE_TESTING = "adaptive_testing"' in init
          assert 'def _rf_path_hint' in optimizer
          assert 'hard_rssi_filtering' in optimizer
          assert 'adaptive_testing:' in services
          assert 'Whole-network Apply is intentionally disabled in v0.7.2' in optimizer
          PY
          rm -rf .seed
          rm -f .github/workflows/apply-v072.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release v0.7.2 adaptive candidate testing'
          git push origin HEAD:main
