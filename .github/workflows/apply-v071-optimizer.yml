name: Apply v0.7.1 optimizer patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-v071-optimizer.yml'
      - '.seed-v071/optimizer.patch'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch and clean bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          git apply .seed-v071/optimizer.patch
          rm -f .seed-v071/optimizer.patch
          rmdir .seed-v071 2>/dev/null || true
          rm -f .github/workflows/apply-v071-optimizer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete v0.7.1 multi-pass optimizer support"
          git push
